    const MANAGER_TG = 'bounqy31';

    // ============================================================
    //  STATE
    // ============================================================
    const state = {
        user: null,
        permissions: null,
        theme: localStorage.getItem('bounty_theme') || 'light',
        currentPage: 'auth',
    };

    // ============================================================
    //  DOM HELPERS
    // ============================================================
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);

    // ============================================================
    //  TOAST
    // ============================================================
    let toastTimer = null;
    function showToast(msg, type = 'info', duration = 2500) {
        const el = $('#toast');
        el.textContent = msg;
        el.className = 'toast ' + type;
        clearTimeout(toastTimer);
        void el.offsetWidth;
        el.classList.add('show');
        toastTimer = setTimeout(() => el.classList.remove('show'), duration);
    }

    // ============================================================
    //  THEME
    // ============================================================
    function applyTheme(theme) {
        state.theme = theme;
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('bounty_theme', theme);
        const btn = $('#themeToggle');
        if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌓';
    }
    function toggleTheme() { applyTheme(state.theme === 'dark' ? 'light' : 'dark'); }
    $('#themeToggle').addEventListener('click', toggleTheme);

    // ============================================================
    //  NAVIGATION
    // ============================================================
    function navigate(page) {
        $$('.page').forEach(p => p.classList.remove('active'));
        const target = $('#page-' + page);
        if (target) target.classList.add('active');
        state.currentPage = page;
        $('#mainContent').scrollTop = 0;
        switch (page) {
            case 'dashboard': renderDashboard(); break;
            case 'voice': renderVoice(); break;
            case 'admin': renderAdmin(); break;
            case 'shooters': renderShooters(); break;
            case 'bs': renderBS(); break;
            case 'tasks': renderTasks(); break;
            case 'rules': renderRules(); break;
            case 'news': renderNews(); break;
            case 'auth': renderAuth(); break;
        }
    }

    // ============================================================
    //  AUTH
    // ============================================================
    async function renderAuth() {
        const container = $('#authContent');
        if (!container) return;
        const tg = window.Telegram?.WebApp;
        let tgUser = tg?.initDataUnsafe?.user;
        if (!tgUser) tgUser = { id: 12345, username: 'testuser', first_name: 'Тест' };
        const telegramId = String(tgUser.id);

        try {
            const { data: users, error } = await supabase
                .from('users')
                .select('*')
                .eq('telegram_id', telegramId);

            if (error) throw error;
            const user = users && users.length > 0 ? users[0] : null;

            if (user) {
                if (user.status === 'approved' && !user.is_blocked) {
                    state.user = user;
                    await loadPermissions(user.id);
                    navigate('dashboard');
                    return;
                } else if (user.status === 'pending') {
                    container.innerHTML = `
                        <div class="auth-status">
                            <span class="big-icon">⏳</span>
                            <strong>Заявка на рассмотрении</strong>
                            <p style="margin-top:8px;font-size:13px;">Ваша заявка ожидает одобрения администрацией.</p>
                            <p style="font-size:12px;color:var(--text-muted);margin-top:4px;">Ник: ${user.nickname}</p>
                        </div>
                    `;
                    return;
                } else if (user.status === 'rejected') {
                    container.innerHTML = `
                        <div class="auth-status" style="border-left:4px solid #e74c3c;">
                            <span class="big-icon">❌</span>
                            <strong>Заявка отклонена</strong>
                            <p style="margin-top:8px;font-size:13px;">К сожалению, ваша заявка не прошла.</p>
                            <button class="btn btn-primary mt-16" onclick="window.location.reload()">Попробовать снова</button>
                        </div>
                    `;
                    return;
                } else if (user.is_blocked) {
                    container.innerHTML = `
                        <div class="auth-status" style="border-left:4px solid #e74c3c;">
                            <span class="big-icon">🚫</span>
                            <strong>Доступ заблокирован</strong>
                            <p style="margin-top:8px;font-size:13px;">Ваш аккаунт был заблокирован.</p>
                        </div>
                    `;
                    return;
                }
            }

            // Форма регистрации
            container.innerHTML = `
                <form id="registerForm" autocomplete="off">
                    <div class="form-group">
                        <label>Телеграм ID</label>
                        <input type="text" value="${telegramId}" disabled style="opacity:0.6;" />
                    </div>
                    <div class="form-group">
                        <label>Игровой ник *</label>
                        <input type="text" id="regNick" placeholder="Ваш ник в игре" required />
                    </div>
                    <div class="form-group">
                        <label>Пароль *</label>
                        <input type="password" id="regPass" placeholder="Придумайте пароль" required minlength="4" />
                    </div>
                    <div class="form-group">
                        <label>Ссылка на скрин / видео *</label>
                        <input type="url" id="regProof" placeholder="https://... (подтверждение в семье)" required />
                    </div>
                    <button type="submit" class="btn btn-primary" id="regSubmit">📩 Отправить заявку</button>
                </form>
                <p style="font-size:12px;color:var(--text-muted);text-align:center;margin-top:12px;">
                    После отправки дождитесь одобрения администрацией.
                </p>
            `;

            const form = $('#registerForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const nickname = $('#regNick').value.trim();
                const password = $('#regPass').value.trim();
                const proof = $('#regProof').value.trim();

                if (!nickname || !password || !proof) { showToast('Заполните все поля', 'error'); return; }
                if (password.length < 4) { showToast('Пароль минимум 4 символа', 'error'); return; }
                if (!proof.startsWith('http://') && !proof.startsWith('https://')) {
                    showToast('Введите корректную ссылку', 'error');
                    return;
                }

                const { data: existing } = await supabase
                    .from('users')
                    .select('nickname')
                    .eq('nickname', nickname);
                if (existing && existing.length > 0) {
                    showToast('Этот ник уже занят', 'error');
                    return;
                }

                const { error: insertError } = await supabase
                    .from('users')
                    .insert({
                        telegram_id: telegramId,
                        nickname,
                        password,
                        proof_link: proof,
                        status: 'pending',
                        role: 'player',
                        is_blocked: false,
                    });

                if (insertError) {
                    showToast('Ошибка: ' + insertError.message, 'error');
                    return;
                }
                showToast('✅ Заявка отправлена! Ожидайте одобрения.', 'success');
                setTimeout(() => renderAuth(), 1500);
            });

        } catch (err) {
            console.error(err);
            container.innerHTML = `
                <div class="auth-status" style="border-left:4px solid #e74c3c;">
                    <strong>❌ Ошибка</strong>
                    <p style="margin-top:8px;">${err.message}</p>
                    <button class="btn btn-primary mt-16" onclick="window.location.reload()">Обновить</button>
                </div>
            `;
        }
    }

    // ============================================================
    //  PERMISSIONS
    // ============================================================
    async function loadPermissions(userId) {
        const { data, error } = await supabase
            .from('admin_permissions')
            .select('*')
            .eq('user_id', userId)
            .maybeSingle();
        if (error && error.code !== 'PGRST116') console.error('Perms error:', error);
        if (data) {
            state.permissions = data;
        } else {
            const defaults = {
                can_manage_applications: false,
                can_manage_shooters: false,
                can_manage_bs: false,
                can_manage_tasks: false,
                can_manage_rules: false,
                can_manage_news: false,
                can_manage_admins: false,
            };
            if (state.user?.role === 'owner') Object.keys(defaults).forEach(k => defaults[k] = true);
            state.permissions = { ...defaults, user_id: userId };
        }
    }

    function hasPerm(perm) {
        if (!state.user) return false;
        if (state.user.role === 'owner') return true;
        if (state.user.role !== 'admin') return false;
        return state.permissions?.[perm] === true;
    }
    function isAdmin() { return state.user && (state.user.role === 'admin' || state.user.role === 'owner'); }
    function isOwner() { return state.user && state.user.role === 'owner'; }

        const detail = document.getElementById('adminPanelDetail');
        if (!detail) return;
        detail.innerHTML = '<div class="loading-center"><div class="spinner"></div></div>';
        switch (tabId) {

            case 'tasks_mgmt': await renderAdminTasks(detail); break;
            case 'shooters_mgmt': await renderAdminShooters(detail); break;
            case 'bs_mgmt': await renderAdminBS(detail); break;
            case 'rules_mgmt': await renderAdminRules(detail); break;

    // ---------- Заявки ----------
    async function renderAdminApplications(panel) {
        if (!hasPerm('can_manage_applications') && !isOwner()) { panel.innerHTML = '<div class="empty-state">Нет прав</div>'; return; }
        const { data, error } = await supabase.from('users').select('*').eq('status', 'pending').order('created_at', { ascending: false });
        if (error) { panel.innerHTML = '<p>Ошибка</p>'; return; }
        if (!data || data.length === 0) { panel.innerHTML = '<div class="empty-state"><div class="icon">✅</div><h3>Нет заявок</h3></div>'; return; }
        panel.innerHTML = `<div class="card-list">${data.map(u => `
            <div class="card-item" data-id="${u.id}">
                <div class="info"><div class="title">${u.nickname}</div><div class="desc">${u.proof_link || 'Нет ссылки'}</div><div class="meta">ID: ${u.telegram_id}</div></div>
                <div class="actions">
                    <button class="btn btn-success btn-sm approve-app">✅</button>
                    <button class="btn btn-danger btn-sm reject-app">❌</button>
                </div>
            </div>
        `).join('')}</div>`;
        panel.querySelectorAll('.approve-app').forEach(btn => btn.addEventListener('click', async () => {
            const id = btn.closest('.card-item').dataset.id;
            await supabase.from('users').update({ status: 'approved' }).eq('id', id);
            showToast('✅ Одобрено', 'success');
            await renderAdminApplications(panel);
        }));
        panel.querySelectorAll('.reject-app').forEach(btn => btn.addEventListener('click', async () => {
            const id = btn.closest('.card-item').dataset.id;
            await supabase.from('users').update({ status: 'rejected' }).eq('id', id);
            showToast('❌ Отклонено', 'error');
            await renderAdminApplications(panel);
        }));
    }

    // ---------- Игроки (owner) ----------
    async function renderAdminPlayers(panel) {
        if (!isOwner()) { panel.innerHTML = '<div class="empty-state">Только для владельца</div>'; return; }
        const { data, error } = await supabase.from('users').select('*').order('created_at', { ascending: false });
        if (error) { panel.innerHTML = '<p>Ошибка</p>'; return; }
        let html = `<button class="btn btn-primary" onclick="showCreatePlayerModal()">➕ Создать игрока</button><div class="card-list" style="margin-top:12px;">`;
        if (!data || data.length === 0) html += `<div class="empty-state">Нет игроков</div>`;
        else {
            data.forEach(u => {
                const statusTag = u.status === 'approved' ? 'tag-approved' : u.status === 'pending' ? 'tag-pending' : 'tag-rejected';
                const roleTag = u.role === 'owner' ? 'tag-owner' : u.role === 'admin' ? 'tag-admin' : 'tag-player';
                html += `
                    <div class="card-item" data-id="${u.id}">
                        <div class="info"><div class="title">${u.nickname} <span class="tag ${roleTag}">${u.role}</span> ${u.is_blocked ? '🚫' : ''}</div><div class="desc">ID: ${u.telegram_id}</div><div class="meta">Статус: <span class="tag ${statusTag}">${u.status}</span></div></div>
                        <div class="actions">
                            <button class="btn btn-warning btn-sm toggle-block" data-id="${u.id}" data-blocked="${u.is_blocked}">${u.is_blocked ? '🔓' : '🔒'}</button>
                            ${u.role !== 'owner' ? `<button class="btn btn-danger btn-sm delete-user" data-id="${u.id}">🗑</button>` : ''}
                        </div>
                    </div>
                `;
            });
        }
        html += `</div>`;
        panel.innerHTML = html;
        // Обработчики
        panel.querySelectorAll('.toggle-block').forEach(btn => btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            const blocked = btn.dataset.blocked === 'true';
            await supabase.from('users').update({ is_blocked: !blocked }).eq('id', id);
            showToast(blocked ? '🔓 Разблокирован' : '🔒 Заблокирован', 'success');
            await renderAdminPlayers(panel);
        }));
        panel.querySelectorAll('.delete-user').forEach(btn => btn.addEventListener('click', async () => {
            if (!confirm('Удалить игрока?')) return;
            await supabase.from('users').delete().eq('id', btn.dataset.id);
            showToast('Удалено', 'success');
            await renderAdminPlayers(panel);
        }));
    }

    // ---------- Админы (owner) ----------

        if (!isOwner()) { panel.innerHTML = '<div class="empty-state">Только для владельца</div>'; return; }
        const { data: admins } = await supabase.from('users').select('*').in('role', ['admin', 'owner']).order('created_at');

        const permMap = {}; if (perms) perms.forEach(p => permMap[p.user_id] = p);
        let html = `<button class="btn btn-primary" onclick="showAddAdminModal()">➕ Добавить админа</button><div class="card-list" style="margin-top:12px;">`;
        if (!admins || admins.length === 0) html += `<div class="empty-state">Нет админов</div>`;
        else {
            admins.forEach(u => {
                const p = permMap[u.id] || {};
                const permList = [];
                if (p.can_manage_applications) permList.push('Заявки');
                if (p.can_manage_shooters) permList.push('Стрелки');
                if (p.can_manage_bs) permList.push('БС');
                if (p.can_manage_tasks) permList.push('Задачи');
                if (p.can_manage_rules) permList.push('Устав');
                if (p.can_manage_news) permList.push('Новости');
                if (p.can_manage_admins) permList.push('Админы');
                const permStr = permList.length ? permList.join(', ') : 'Нет прав';
                html += `
                    <div class="card-item" data-id="${u.id}">
                        <div class="info"><div class="title">${u.nickname} <span class="tag ${u.role === 'owner' ? 'tag-owner' : 'tag-admin'}">${u.role}</span></div><div class="desc">${permStr}</div></div>
                        <div class="actions">
                            ${u.role !== 'owner' ? `

                        </div>
                    </div>
                `;
            });

        panel.querySelectorAll('.edit-admin').forEach(btn => btn.addEventListener('click', () => showEditAdminModal(btn.dataset.id)));
        panel.querySelectorAll('.remove-admin').forEach(btn => btn.addEventListener('click', async () => {

            await supabase.from('admin_permissions').delete().eq('user_id', id);
            showToast('✅ Админ удалён', 'success');
            await renderAdminAdmins(panel);
        }));
    }

    window.showEditTaskModal = async function(taskId) {
        let task = null;
        if (taskId) {
            const { data } = await supabase.from('tasks').select('*').eq('id', taskId).maybeSingle();
            if (data) task = data;
        }
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
            <div class="modal-box">
                <h3>${task ? '✏️ Редактировать задачу' : '➕ Новая задача'}</h3>
                <div class="form-group"><label>Название *</label><input type="text" id="taskTitle" value="${task ? task.title : ''}" /></div>
                <div class="form-group"><label>Описание</label><textarea id="taskDesc" rows="3">${task ? task.description || '' : ''}</textarea></div>
                <div class="form-group">
                    <label>Прогресс: <span id="progressLabel">${task ? task.progress : 0}%</span></label>
                    <input type="range" id="taskProgress" min="0" max="100" value="${task ? task.progress : 0}" />
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" id="modalCancel">Отмена</button>
                    <button class="btn btn-primary" id="modalSave">${task ? 'Сохранить' : 'Создать'}</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        const range = overlay.querySelector('#taskProgress');
        const label = overlay.querySelector('#progressLabel');
        range.addEventListener('input', () => { label.textContent = range.value + '%'; });
        overlay.querySelector('#modalCancel').onclick = () => overlay.remove();
        overlay.querySelector('#modalSave').onclick = async () => {
            const title = overlay.querySelector('#taskTitle').value.trim();
            const desc = overlay.querySelector('#taskDesc').value.trim();
            const progress = parseInt(range.value) || 0;
            if (!title) { showToast('Введите название', 'error'); return; }
            const payload = { title, description: desc, progress };
            if (task) {
                await supabase.from('tasks').update(payload).eq('id', task.id);
            } else {
                payload.created_by = state.user.id;
                await supabase.from('tasks').insert(payload);
            }
            showToast('✅ Сохранено', 'success');
            overlay.remove();
            const panel = document.getElementById('adminPanelDetail');
            if (panel) await renderAdminTasks(panel);
        };
    };

                if (state.currentPage !== 'dashboard' && state.currentPage !== 'auth') navigate('dashboard');
            });
            const observer = new MutationObserver(() => {
                if (tg.BackButton) {
                    const show = state.currentPage !== 'dashboard' && state.currentPage !== 'auth';
                    tg.BackButton[show ? 'show' : 'hide']();
                }
            });
            observer.observe(document.querySelector('.page.active') || document.body, { attributes: true, attributeFilter: ['class'], subtree: true });
        }

        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) e.target.remove();
        });

        console.log('🚀 BOUNTY TEAM Mini App запущен');
    })();
</script>
</body>
</html>
