<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPA Web Application</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-element: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #22c55e;
            --success-hover: #16a34a;
            --warning: #f59e0b;
            --warning-hover: #d97706;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 75px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Навигационная панель */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border);
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            height: 100%;
            justify-content: center;
            transition: color 0.2s ease;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item .icon {
            font-size: 20px;
        }

        /* Секции SPA */
        .section {
            display: none;
            animation: fadeIn 0.25s ease-in-out;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Карточки и блоки */
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        /* Формы и Инпуты */
        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-element);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--primary);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Сетка Кнопок */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }

        .btn {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #fff;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-primary { background: var(--primary); }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-secondary { background: var(--bg-element); color: var(--text-main); }

        /* Лента постов */
        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .post-author {
            font-weight: 600;
            color: var(--primary);
            font-size: 14px;
        }

        .post-date {
            font-size: 11px;
            color: var(--text-muted);
        }

        .post-content {
            font-size: 14px;
            line-height: 1.5;
            color: #e2e8f0;
            white-space: pre-wrap;
        }

        .post-actions {
            margin-top: 10px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        /* Список пользователей в "Все функции" */
        .user-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }

        .badge-owner { background: #f59e0b; color: #000; }
        .badge-admin { background: #6366f1; color: #fff; }
        .badge-banned { background: #ef4444; color: #fff; }

        /* Полноэкранный блок бана */
        #banScreen {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #090d16;
            z-index: 99999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
        }

        #banScreen.active {
            display: flex;
        }

        #banScreen h1 {
            font-size: 32px;
            color: var(--danger);
            margin-bottom: 12px;
        }

        #banScreen p {
            color: var(--text-muted);
            max-width: 400px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- Экран Блокировки (Забанен) -->
    <div id="banScreen">
        <h1>🔨 Вы заблокированы</h1>
        <p>Ваш аккаунт был заблокирован владельцем системы. Доступ к приложению полностью ограничен.</p>
    </div>

    <div class="container">

        <!-- 1. СЕКЦИЯ ЛЕНТЫ ПУБЛИКАЦИЙ -->
        <section class="section active" id="section-feed">
            <h2>📜 Лента публикаций</h2>
            
            <div class="card">
                <div class="form-group">
                    <textarea id="newPostContent" placeholder="Что у вас нового?..."></textarea>
                </div>
                <button class="btn btn-primary" onclick="createPost()" style="width: 100%;">Опубликовать</button>
            </div>

            <div id="postsList"></div>
        </section>

        <!-- 2. СЕКЦИЯ АДМИН-ПАНЕЛИ -->
        <section class="section" id="section-admin">
            <h2>🛡️ Админ-панель</h2>
            <div id="adminPanelContent"></div>
        </section>

    </div>

    <!-- Нижняя навигация -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchSection('section-feed')">
            <span class="icon">📜</span>
            <span>Лента</span>
        </button>
        <button class="nav-item" id="navAdminBtn" style="display: none;" onclick="switchSection('section-admin')">
            <span class="icon">🛡️</span>
            <span>Админ</span>
        </button>
    </nav>

    <!-- Модальное окно "Все функции" -->
    <div class="modal-overlay" id="allFunctionsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ Системный менеджер функций</h3>
                <button class="close-btn" onclick="closeModal('allFunctionsModal')">&times;</button>
            </div>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">Полная база зарегистрированных пользователей приложения:</p>
            <div id="usersListContent"></div>
        </div>
    </div>

    <script>
        // Инициализация базы данных в LocalStorage
        const defaultUsers = [
            { id: "101", username: "bounqy", nickname: "Главный Владелец", isAdmin: true, isOwner: true, isBanned: false },
            { id: "102", username: "GG_Monolit", nickname: "Monolit_Player", isAdmin: false, isOwner: false, isBanned: false },
            { id: "103", username: "alex_pro", nickname: "Alex_Game", isAdmin: true, isOwner: false, isBanned: false },
            { id: "104", username: "cheater99", nickname: "Banned_User", isAdmin: false, isOwner: false, isBanned: true }
        ];

        const defaultPosts = [
            { id: 1, author: "bounqy", content: "Добро пожаловать в обновленное единое приложение!", date: "10.09.2026, 10:00" },
            { id: 2, author: "GG_Monolit", content: "Всем привет! Отличный скрипт получается.", date: "10.09.2026, 10:15" }
        ];

        let usersDB = JSON.parse(localStorage.getItem('app_users_db')) || defaultUsers;
        let postsDB = JSON.parse(localStorage.getItem('app_posts_db')) || defaultPosts;

        // Авторизованный пользователь (меняй username для теста)
        const currentUser = { username: 'bounqy' };

        function saveData() {
            localStorage.setItem('app_users_db', JSON.stringify(usersDB));
            localStorage.setItem('app_posts_db', JSON.stringify(postsDB));
        }

        function getCurrentUserData() {
            return usersDB.find(u => u.username === currentUser.username) || {
                id: "0",
                username: currentUser.username,
                nickname: currentUser.username,
                isAdmin: false,
                isOwner: currentUser.username === 'bounqy',
                isBanned: false
            };
        }

        // Проверка на статус блокировки
        function checkBanStatus() {
            const userData = getCurrentUserData();
            const banScreen = document.getElementById('banScreen');
            if (userData.isBanned) {
                banScreen.classList.add('active');
            } else {
                banScreen.classList.remove('active');
            }
        }

        // Навигация между страницами SPA
        function switchSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

            document.getElementById(sectionId).classList.add('active');

            if (sectionId === 'section-feed') {
                document.querySelectorAll('.nav-item')[0].classList.add('active');
            } else if (sectionId === 'section-admin') {
                document.getElementById('navAdminBtn').classList.add('active');
            }
        }

        // ОТРИСОВКА ЛЕНТЫ ПУБЛИКАЦИЙ
        function renderPosts() {
            const container = document.getElementById('postsList');
            const userData = getCurrentUserData();
            const isOwner = userData.username === 'bounqy';
            const isAdmin = userData.isAdmin || isOwner;

            container.innerHTML = postsDB.map(post => `
                <div class="post-card">
                    <div class="post-header">
                        <span class="post-author">@${post.author}</span>
                        <span class="post-date">${post.date}</span>
                    </div>
                    <div class="post-content">${escapeHTML(post.content)}</div>
                    ${(isAdmin) ? `
                        <div class="post-actions">
                            <button class="btn btn-danger" onclick="deletePost(${post.id})" style="padding: 4px 8px; font-size: 11px;">🗑️ Удалить пост</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function createPost() {
            const input = document.getElementById('newPostContent');
            const text = input.value.trim();
            if (!text) return alert('Введите текст публикации!');

            const newPost = {
                id: Date.now(),
                author: currentUser.username,
                content: text,
                date: new Date().toLocaleString('ru-RU')
            };

            postsDB.unshift(newPost);
            saveData();
            input.value = '';
            renderPosts();
        }

        function deletePost(postId) {
            if (confirm('Удалить эту публикацию из ленты?')) {
                postsDB = postsDB.filter(p => p.id !== postId);
                saveData();
                renderPosts();
            }
        }

        // ИНИЦИАЛИЗАЦИЯ АДМИН-ПАНЕЛИ
        function initAdminPanel() {
            const userData = getCurrentUserData();
            const isOwner = userData.username === 'bounqy';
            const isAdmin = userData.isAdmin || isOwner;

            const navAdminBtn = document.getElementById('navAdminBtn');
            const adminContent = document.getElementById('adminPanelContent');

            // Показываем кнопку админа в nav-bar только авторизованным модераторам/владельцам
            if (isAdmin) {
                navAdminBtn.style.display = 'flex';
            } else {
                navAdminBtn.style.display = 'none';
                return;
            }

            let html = '';

            // 👑 БЛОК УПРАВЛЕНИЯ ПОЛЬЗОВАТЕЛЯМИ ДЛЯ ВЛАДЕЛЬЦА
            if (isOwner) {
                html += `
                    <div class="card">
                        <h3 style="color: var(--warning); font-size: 16px; margin-bottom: 12px;">👑 Управление пользователями (владелец)</h3>
                        <div class="form-group">
                            <label>Введите username, Nick_Name или ID пользователя:</label>
                            <input type="text" id="adminTargetInput" placeholder="Например: GG_Monolit, bounqy или ID 102...">
                        </div>
                        <div class="btn-grid">
                            <button class="btn btn-secondary" id="adminAllFunctionsBtn">⚙️ Все функции</button>
                            <button class="btn btn-danger" id="adminBanBtn">🔨 Забанить</button>
                            <button class="btn btn-success" id="adminUnbanBtn">🔓 Разбанить</button>
                            <button class="btn btn-warning" id="adminMakeAdminBtn">👑 Сделать админом</button>
                            <button class="btn btn-secondary" id="adminRemoveAdminBtn">⬇️ Снять админа</button>
                        </div>
                    </div>
                `;
            }

            // Стандартный блок модерации
            html += `
                <div class="card">
                    <h3 style="font-size: 15px; margin-bottom: 8px;">🛡️ Стандартные функции системы</h3>
                    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">Вам доступны права модератора приложения.</p>
                    <button class="btn btn-danger" onclick="clearFeedByAdmin()">🗑️ Очистить всю ленту публикаций</button>
                </div>
            `;

            adminContent.innerHTML = html;

            // Привязываем события для кнопок владельца
            if (isOwner) {
                document.getElementById('adminAllFunctionsBtn').addEventListener('click', openAllFunctionsModal);
                document.getElementById('adminBanBtn').addEventListener('click', () => processOwnerAction('ban'));
                document.getElementById('adminUnbanBtn').addEventListener('click', () => processOwnerAction('unban'));
                document.getElementById('adminMakeAdminBtn').addEventListener('click', () => processOwnerAction('makeAdmin'));
                document.getElementById('adminRemoveAdminBtn').addEventListener('click', () => processOwnerAction('removeAdmin'));
            }
        }

        // ПОИСК ПОЛЬЗОВАТЕЛЯ ПО Username, Nick_Name ИЛИ ID
        function findUser(query) {
            if (!query) return null;
            const target = query.trim().toLowerCase();
            return usersDB.find(u => 
                u.id.toLowerCase() === target ||
                u.username.toLowerCase() === target ||
                u.nickname.toLowerCase() === target
            );
        }

        // ОБРАБОТКА ДЕЙСТВИЙ КНОПОК ВЛАДЕЛЬЦА
        function processOwnerAction(action) {
            const inputField = document.getElementById('adminTargetInput');
            const val = inputField.value;

            if (!val) {
                alert('Пожалуйста, укажите username, Nick_Name или ID!');
                return;
            }

            let targetUser = findUser(val);

            // Если пользователя нет в базе — создаем его запись для корректного применения функции
            if (!targetUser) {
                targetUser = {
                    id: String(Date.now()),
                    username: val,
                    nickname: val,
                    isAdmin: false,
                    isOwner: false,
                    isBanned: false
                };
                usersDB.push(targetUser);
            }

            // Защита системы: Запрет любых санкций против Владельца 'bounqy'
            if (targetUser.username === 'bounqy' && action !== 'unban') {
                alert('Ошибка: Запрещено применять данные действия к Владельцу!');
                return;
            }

            switch (action) {
                case 'ban':
                    targetUser.isBanned = true;
                    alert(`Пользователь ${targetUser.nickname} (@${targetUser.username}) забанен! 🔨`);
                    break;
                case 'unban':
                    targetUser.isBanned = false;
                    alert(`Пользователь ${targetUser.nickname} (@${targetUser.username}) разбанен! 🔓`);
                    break;
                case 'makeAdmin':
                    targetUser.isAdmin = true;
                    alert(`Пользователю ${targetUser.nickname} (@${targetUser.username}) выдан доступ Администратора! 👑`);
                    break;
                case 'removeAdmin':
                    targetUser.isAdmin = false;
                    alert(`У пользователя ${targetUser.nickname} (@${targetUser.username}) отозваны права Администратора! ⬇️`);
                    break;
            }

            saveData();
            inputField.value = '';
            checkBanStatus();
            renderPosts();
            initAdminPanel();
        }

        // КНОПКА "⚙️ ВСЕ ФУНКЦИИ"
        function openAllFunctionsModal() {
            const container = document.getElementById('usersListContent');
            container.innerHTML = usersDB.map(u => `
                <div class="user-item-row">
                    <div>
                        <strong>${escapeHTML(u.nickname)}</strong> 
                        <span style="color: var(--text-muted); font-size: 11px;">(@${u.username} | ID: ${u.id})</span>
                    </div>
                    <div>
                        ${u.isOwner ? '<span class="badge badge-owner">Владелец</span>' : ''}
                        ${u.isAdmin && !u.isOwner ? '<span class="badge badge-admin">Админ</span>' : ''}
                        ${u.isBanned ? '<span class="badge badge-banned">Забанен</span>' : ''}
                    </div>
                </div>
            `).join('');

            document.getElementById('allFunctionsModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function clearFeedByAdmin() {
            if (confirm('Вы действительно хотите полностью очистить ленту публикаций?')) {
                postsDB = [];
                saveData();
                renderPosts();
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Запуск при загрузке документа
        document.addEventListener('DOMContentLoaded', () => {
            checkBanStatus();
            renderPosts();
            initAdminPanel();
        });
    </script>
</body>
</html>
