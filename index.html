<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BOUNTY TEAM</title>
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        :root { --bg:#fff; --bg2:#f5f5f5; --card:#fff; --text:#1a1a1a; --text2:#555; --muted:#888; --border:#ddd; --shadow:0 2px 12px rgba(0,0,0,0.08); --accent:#FFCC00; --radius:12px; --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
        [data-theme="dark"] { --bg:#0d0d0d; --bg2:#1a1a1a; --card:#222; --text:#f0f0f0; --text2:#aaa; --muted:#777; --border:#333; --accent:#CC9900; }
        html,body { height:100%; font-family:var(--font); background:var(--bg); color:var(--text); transition:0.3s; overflow:hidden; }
        #app { display:flex; flex-direction:column; height:100vh; max-width:480px; margin:0 auto; background:var(--bg); overflow:hidden; }
        .header { display:flex; align-items:center; justify-content:space-between; padding:0 16px; height:60px; background:var(--bg); border-bottom:1px solid var(--border); flex-shrink:0; }
        .brand { font-size:20px; font-weight:800; background:linear-gradient(90deg,var(--accent),#fff,var(--accent)); background-size:300%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:shimmer 4s infinite; }
        @keyframes shimmer { 0%,100%{background-position:0%} 50%{background-position:100%} }
        .header-actions { display:flex; gap:8px; align-items:center; }
        .theme-btn { background:var(--bg2); border:none; width:36px; height:36px; border-radius:50%; font-size:18px; cursor:pointer; color:var(--text); }
        .user-badge { display:flex; align-items:center; gap:6px; background:var(--bg2); padding:4px 12px 4px 8px; border-radius:20px; font-size:13px; color:var(--text2); }
        .user-badge .avatar { width:28px; height:28px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; color:#1a1a1a; text-transform:uppercase; }
        .user-badge .role { font-size:9px; text-transform:uppercase; background:var(--accent); padding:2px 6px; border-radius:10px; color:#1a1a1a; font-weight:700; }
        .content { flex:1; overflow-y:auto; padding:16px; padding-bottom:80px; }
        .page { display:none; animation:fade .3s; }
        .page.active { display:block; }
        @keyframes fade { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
        .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .card { background:var(--card); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); border:1px solid var(--border); text-align:center; cursor:pointer; transition:0.2s; position:relative; }
        .card:active { transform:scale(0.96); }
        .card .icon { font-size:28px; }
        .card .label { font-weight:600; font-size:14px; margin-top:4px; color:var(--text); }
        .card .sub { font-size:12px; color:var(--muted); }
        .card .badge { position:absolute; top:6px; right:6px; background:var(--accent); color:#1a1a1a; font-size:9px; padding:2px 8px; border-radius:10px; font-weight:700; }
        .form-group { margin-bottom:14px; }
        .form-group label { display:block; font-size:13px; font-weight:600; color:var(--text2); margin-bottom:4px; }
        .form-group input, .form-group textarea, .form-group select { width:100%; padding:10px 12px; border:2px solid var(--border); border-radius:8px; background:var(--bg2); color:var(--text); font-size:15px; outline:none; transition:0.2s; }
        .form-group input:focus, .form-group textarea:focus { border-color:var(--accent); }
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 20px; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; transition:0.2s; min-height:44px; width:100%; color:#1a1a1a; }
        .btn:active { transform:scale(0.97); }
        .btn-primary { background:var(--accent); }
        .btn-primary:active { background:#e6b800; }
        .btn-secondary { background:var(--bg2); color:var(--text); border:1px solid var(--border); }
        .btn-danger { background:#e74c3c; color:#fff; }
        .btn-success { background:#27ae60; color:#fff; }
        .btn-sm { padding:6px 12px; font-size:13px; min-height:32px; width:auto; }
        .list { display:flex; flex-direction:column; gap:10px; }
        .list-item { background:var(--card); border-radius:8px; padding:12px 14px; border:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:10px; }
        .list-item .info { flex:1; min-width:0; }
        .list-item .title { font-weight:600; font-size:14px; color:var(--text); }
        .list-item .desc { font-size:13px; color:var(--text2); }
        .list-item .meta { font-size:11px; color:var(--muted); margin-top:2px; }
        .list-item .actions { display:flex; gap:6px; flex-wrap:wrap; }
        .progress-wrap { height:6px; background:var(--bg2); border-radius:4px; overflow:hidden; margin-top:4px; }
        .progress-wrap .bar { height:100%; background:var(--accent); transition:width 0.4s; }
        .share-btn { background:transparent; border:1px solid var(--accent); color:var(--accent); padding:4px 12px; border-radius:16px; font-size:12px; font-weight:600; cursor:pointer; }
        .empty { text-align:center; padding:40px 20px; color:var(--muted); }
        .empty .icon { font-size:48px; }
        .empty h3 { font-size:18px; color:var(--text2); margin-top:8px; }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; display:flex; align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(4px); }
        .modal-box { background:var(--card); border-radius:var(--radius); max-width:400px; width:100%; padding:24px; max-height:90vh; overflow-y:auto; }
        .modal-box h3 { font-size:20px; font-weight:700; margin-bottom:16px; }
        .modal-actions { display:flex; gap:10px; margin-top:16px; }
        .modal-actions .btn { flex:1; }
        .tag { display:inline-block; padding:2px 10px; border-radius:12px; font-size:11px; font-weight:600; }
        .tag-pending { background:#f39c12; color:#fff; }
        .tag-approved { background:#27ae60; color:#fff; }
        .tag-rejected { background:#e74c3c; color:#fff; }
        .tag-owner { background:#8e44ad; color:#fff; }
        .tag-admin { background:#2980b9; color:#fff; }
        .tag-player { background:var(--bg2); color:var(--text2); }
        .rank-badge { background:var(--accent); color:#1a1a1a; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:700; }
        .back-btn { background:none; border:none; color:var(--text2); font-size:14px; cursor:pointer; padding:6px 0; }
        .back-btn:hover { color:var(--accent); }
        .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
        .section-header h2 { font-size:20px; font-weight:700; }
        .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#1a1a1a; color:#fff; padding:12px 20px; border-radius:8px; font-size:14px; font-weight:500; box-shadow:0 4px 20px rgba(0,0,0,0.3); opacity:0; transition:0.3s; pointer-events:none; z-index:999; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .toast.success { border-left:4px solid #27ae60; }
        .toast.error { border-left:4px solid #e74c3c; }
        .spinner { display:inline-block; width:24px; height:24px; border:3px solid var(--bg2); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .loading-center { display:flex; justify-content:center; padding:40px 0; }
        .tabs { display:flex; gap:4px; background:var(--bg2); padding:4px; border-radius:8px; overflow-x:auto; margin-bottom:14px; }
        .tabs .tab { flex:1; padding:8px 12px; text-align:center; border-radius:6px; font-size:13px; font-weight:600; color:var(--text2); cursor:pointer; background:transparent; border:none; white-space:nowrap; }
        .tabs .tab.active { background:var(--card); color:var(--text); box-shadow:var(--shadow); }
        .tab-content { display:none; animation:fade .25s; }
        .tab-content.active { display:block; }
        @media (max-width:400px){ .grid{ gap:8px; } .card{ padding:12px; } .brand{ font-size:17px; } }
    </style>
</head>
<body>

<div id="app">
    <header class="header">
        <div class="brand">✦ BOUNTY TEAM</div>
        <div class="header-actions">
            <button class="theme-btn" id="themeToggle">🌓</button>
            <div class="user-badge" id="userBadge">
                <span class="avatar" id="avatar">?</span>
                <span id="username">Гость</span>
                <span class="role" id="roleBadge">—</span>
            </div>
        </div>
    </header>

    <div class="content" id="content">
        <!-- Страница авторизации -->
        <div class="page active" id="page-auth">
            <div style="max-width:400px;margin:20px auto;background:var(--card);border-radius:var(--radius);padding:24px;border:1px solid var(--border);">
                <div class="brand" style="font-size:24px;text-align:center;display:block;margin-bottom:6px;">✦ BOUNTY TEAM</div>
                <p style="text-align:center;color:var(--text2);margin-bottom:20px;">Добро пожаловать в команду!</p>
                <div id="authContent"></div>
            </div>
        </div>

        <!-- Дашборд -->
        <div class="page" id="page-dashboard">
            <div class="grid" id="dashboardGrid"></div>
        </div>

        <!-- Войс Штаб -->
        <div class="page" id="page-voice">
            <div class="section-header">
                <button class="back-btn" data-page="dashboard">‹ Назад</button>
                <h2>🎙 Войс Штаб</h2>
            </div>
            <div style="text-align:center;padding:30px 0;">
                <p style="color:var(--text2);margin-bottom:20px;">Перейти в голосовой штаб</p>
                <button class="btn btn-primary" id="voiceBtn" style="max-width:280px;margin:0 auto;">🚀 Перейти</button>
            </div>
        </div>

        <!-- Администрация -->
        <div class="page" id="page-admin">
            <div class="section-header">
                <button class="back-btn" data-page="dashboard">‹ Назад</button>
                <h2>⚙️ Администрация</h2>
            </div>
            <div id="adminContent"></div>
        </div>

        <!-- Стрелки -->
        <div class="page" id="page-shooters">
            <div class="section-header">
                <button class="back-btn" data-page="dashboard">‹ Назад</button>
                <h2>🎯 Стрелки</h2>
                <div id="shootersActions"></div>
            </div>
            <div id="shootersContent"></div>
        </div>

        <!-- БС Состав -->
        <div class="page" id="page-bs">
            <div class="section-header">
                <button class="back-btn" data-page="dashboard">‹ Назад</button>
                <h2>🛡 БС Состав</h2>
                <div id="bsActions"></div>
            </div>
            <div id="bsContent"></div>
        </div>

        <!-- Задачи -->
        <div class="page" id="page-tasks">
            <div class="section-header">
                <button class="back-btn" data-page="dashboard">‹ Назад</button>
                <h2>📋 Задачи &amp; Цели</h2>
                <div id="tasksActions"></div>
            </div>
            <div id="tasksContent"></div>
        </div>

        <!-- Устав -->
        <div class="page" id="page-rules">
            <div class="section-header">
                <button class="back-btn" data-page="dashboard">‹ Назад</button>
                <h2>📜 Устав &amp; Правила</h2>
                <div id="rulesActions"></div>
            </div>
            <div id="rulesContent"></div>
        </div>

        <!-- Новости -->
        <div class="page" id="page-news">
            <div class="section-header">
                <button class="back-btn" data-page="dashboard">‹ Назад</button>
                <h2>📰 Новости</h2>
                <div id="newsActions"></div>
            </div>
            <div id="newsContent"></div>
        </div>

    </div>

    <div class="toast" id="toast"></div>
</div>

<script>
    // ============================================================
    // 1. КОНФИГУРАЦИЯ
    // ============================================================
    const SUPABASE_URL = 'https://hhsyhblhqjjsvuumaovg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhoc3loYmxocWpqc3Z1dW1hb3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NjA0MzgsImV4cCI6MjEwNDQzNjQzOH0.3AvM5HGAIP4PnT1pEIWLuuIvvnPxV2v7bSU4x57rlx8';

    console.log('🔌 Создаём клиент Supabase с URL:', SUPABASE_URL);
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    console.log('✅ Клиент создан');

    // Проверка подключения
    (async function testConnection() {
        try {
            const { data, error } = await supabase.from('users').select('count', { count: 'exact', head: true });
            console.log('📊 Проверка подключения к users:', error ? '❌ Ошибка: ' + error.message : '✅ Успешно, таблица users существует');
            if (error) {
                console.error('❌ Ошибка подключения:', error);
                showToast('Ошибка подключения к Supabase: ' + error.message, 'error');
            }
        } catch (e) {
            console.error('❌ Критическая ошибка:', e);
        }
    })();

    const MANAGER_TG = 'bounqy31';
    const VOICE_LINK = 'https://vk.me/join/QwCqYDLM9KG9TjYsaRP8uQ5oIonjcOa0xIc=';
    const OWNER_USERNAME = 'bounqy';

    // ============================================================
    // 2. СОСТОЯНИЕ
    // ============================================================
    let state = {
        user: null,
        permissions: null,
        theme: localStorage.getItem('bounty_theme') || 'light',
        currentPage: 'auth',
    };

    // ============================================================
    // 3. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);

    function showToast(msg, type = 'info', duration = 3000) {
        const el = $('#toast');
        el.textContent = msg;
        el.className = 'toast ' + type;
        clearTimeout(el._timer);
        void el.offsetWidth;
        el.classList.add('show');
        el._timer = setTimeout(() => el.classList.remove('show'), duration);
    }

    async function hashPassword(password) {
        const enc = new TextEncoder().encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', enc);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function applyTheme(theme) {
        state.theme = theme;
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('bounty_theme', theme);
        $('#themeToggle').textContent = theme === 'dark' ? '☀️' : '🌓';
    }
    $('#themeToggle').addEventListener('click', () => applyTheme(state.theme === 'dark' ? 'light' : 'dark'));

    function navigate(page) {
        $$('.page').forEach(p => p.classList.remove('active'));
        const target = $('#page-' + page);
        if (target) target.classList.add('active');
        state.currentPage = page;
        $('#content').scrollTop = 0;
        const tg = window.Telegram?.WebApp;
        if (tg && tg.BackButton) {
            const show = page !== 'dashboard' && page !== 'auth';
            if (show) tg.BackButton.show(); else tg.BackButton.hide();
        }
        switch (page) {
            case 'dashboard': renderDashboard(); break;
            case 'voice': renderVoice(); break;
            case 'admin': renderAdmin(); break;
            case 'shooters': renderShooters(); break;
            case 'bs': renderBS(); break;
            case 'tasks': renderTasks(); break;
            case 'rules': renderRules(); break;
            case 'news': renderNews(); break;
            case 'auth': renderAuth(); break;
        }
        updateHeader();
    }

    function updateHeader() {
        const u = state.user;
        const avatar = $('#avatar');
        const name = $('#username');
        const role = $('#roleBadge');
        if (u) {
            avatar.textContent = u.nickname ? u.nickname.charAt(0).toUpperCase() : '?';
            name.textContent = u.nickname || 'Игрок';
            const map = { owner: 'Владелец', admin: 'Админ', player: 'Игрок' };
            role.textContent = map[u.role] || u.role;
            role.style.display = 'inline';
        } else {
            avatar.textContent = '?';
            name.textContent = 'Гость';
            role.textContent = '—';
            role.style.display = 'none';
        }
    }

    function isAdmin() { return state.user && (state.user.role === 'admin' || state.user.role === 'owner'); }
    function isOwner() { return state.user && state.user.role === 'owner'; }
    function hasPerm(perm) {
        if (!state.user) return false;
        if (isOwner()) return true;
        if (state.user.role !== 'admin') return false;
        return state.permissions?.[perm] === true;
    }

    // ============================================================
    // 4. АВТОРИЗАЦИЯ
    // ============================================================
    async function renderAuth() {
        const container = $('#authContent');
        if (!container) return;

        const tg = window.Telegram?.WebApp;
        let tgUser = null;
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            tgUser = tg.initDataUnsafe.user;
        }

        if (!tgUser) {
            const savedId = localStorage.getItem('bounty_telegram_id');
            if (savedId) {
                tgUser = { id: savedId, username: 'player' };
            } else {
                showManualLoginForm(container);
                return;
            }
        }
        const telegramId = String(tgUser.id);

        try {
            console.log('🔍 Ищем пользователя с telegram_id:', telegramId);
            const { data: users, error } = await supabase
                .from('users')
                .select('*')
                .eq('telegram_id', telegramId);

            if (error) {
                console.error('❌ Ошибка запроса к Supabase:', error);
                container.innerHTML = `
                    <div style="text-align:center;padding:20px;border-left:4px solid #e74c3c;">
                        <strong>❌ Ошибка подключения к базе данных</strong>
                        <p style="color:var(--text2);margin:8px 0;">${error.message}</p>
                        <p style="font-size:12px;color:var(--muted);">Проверьте настройки Supabase в консоли (F12)</p>
                        <button class="btn btn-primary mt-16" onclick="location.reload()">Обновить</button>
                    </div>
                `;
                return;
            }

            const user = users && users.length > 0 ? users[0] : null;
            console.log('📄 Найден пользователь:', user);

            if (user) {
                if (user.status === 'approved' && !user.is_blocked) {
                    state.user = user;
                    await loadPermissions(user.id);
                    navigate('dashboard');
                    return;
                } else if (user.status === 'pending') {
                    container.innerHTML = `
                        <div style="text-align:center;padding:20px;">
                            <span style="font-size:48px;">⏳</span>
                            <h3>Заявка на рассмотрении</h3>
                            <p style="color:var(--text2);">Ожидайте одобрения администрацией.</p>
                            <p style="font-size:12px;color:var(--muted);">Ник: ${user.nickname}</p>
                            <button class="btn btn-secondary mt-16" onclick="localStorage.removeItem('bounty_telegram_id'); location.reload();">Сменить аккаунт</button>
                        </div>
                    `;
                    return;
                } else if (user.status === 'rejected') {
                    container.innerHTML = `
                        <div style="text-align:center;padding:20px;border-left:4px solid #e74c3c;">
                            <span style="font-size:48px;">❌</span>
                            <h3>Заявка отклонена</h3>
                            <button class="btn btn-primary mt-16" onclick="localStorage.removeItem('bounty_telegram_id'); location.reload();">Попробовать снова</button>
                        </div>
                    `;
                    return;
                } else if (user.is_blocked) {
                    container.innerHTML = `
                        <div style="text-align:center;padding:20px;border-left:4px solid #e74c3c;">
                            <span style="font-size:48px;">🚫</span>
                            <h3>Доступ заблокирован</h3>
                        </div>
                    `;
                    return;
                }
            }

            // Форма регистрации
            container.innerHTML = `
                <form id="registerForm">
                    <div class="form-group">
                        <label>Телеграм ID</label>
                        <input type="text" id="regTgId" value="${telegramId}" required />
                        <small style="color:var(--muted);">Вы можете изменить ID, если ошиблись</small>
                    </div>
                    <div class="form-group">
                        <label>Игровой ник *</label>
                        <input type="text" id="regNick" placeholder="Ваш ник" required />
                    </div>
                    <div class="form-group">
                        <label>Пароль *</label>
                        <input type="password" id="regPass" placeholder="Пароль (мин. 4 символа)" required minlength="4" />
                    </div>
                    <div class="form-group">
                        <label>Ссылка на скрин / видео *</label>
                        <input type="url" id="regProof" placeholder="https://..." required />
                    </div>
                    <button type="submit" class="btn btn-primary">📩 Отправить заявку</button>
                </form>
                <p style="font-size:12px;color:var(--muted);text-align:center;margin-top:12px;">После отправки дождитесь одобрения.</p>
            `;

            const form = $('#registerForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const tgId = $('#regTgId').value.trim();
                const nickname = $('#regNick').value.trim();
                const password = $('#regPass').value.trim();
                const proof = $('#regProof').value.trim();

                if (!tgId || !nickname || !password || !proof) {
                    showToast('Заполните все поля', 'error');
                    return;
                }
                if (password.length < 4) {
                    showToast('Пароль минимум 4 символа', 'error');
                    return;
                }
                if (!proof.startsWith('http://') && !proof.startsWith('https://')) {
                    showToast('Введите корректную ссылку', 'error');
                    return;
                }

                const { data: existing } = await supabase
                    .from('users')
                    .select('nickname')
                    .eq('nickname', nickname);
                if (existing && existing.length > 0) {
                    showToast('Этот ник уже занят', 'error');
                    return;
                }

                const passwordHash = await hashPassword(password);

                let status = 'pending';
                let role = 'player';
                if (nickname.toLowerCase() === OWNER_USERNAME.toLowerCase()) {
                    status = 'approved';
                    role = 'owner';
                }

                const { error: insertError } = await supabase
                    .from('users')
                    .insert({
                        telegram_id: tgId,
                        nickname,
                        password: passwordHash,
                        proof_link: proof,
                        status: status,
                        role: role,
                        is_blocked: false,
                    });

                if (insertError) {
                    showToast('Ошибка: ' + insertError.message, 'error');
                    return;
                }

                localStorage.setItem('bounty_telegram_id', tgId);

                if (role === 'owner') {
                    showToast('✅ Вы зарегистрированы как владелец!', 'success');
                    const { data: newUser } = await supabase
                        .from('users')
                        .select('*')
                        .eq('telegram_id', tgId)
                        .single();
                    state.user = newUser;
                    await loadPermissions(newUser.id);
                    navigate('dashboard');
                } else {
                    showToast('✅ Заявка отправлена!', 'success');
                    setTimeout(() => renderAuth(), 1500);
                }
            });

        } catch (err) {
            console.error('❌ Критическая ошибка:', err);
            container.innerHTML = `
                <div style="text-align:center;padding:20px;border-left:4px solid #e74c3c;">
                    <strong>❌ Ошибка</strong>
                    <p>${err.message}</p>
                    <button class="btn btn-primary mt-16" onclick="location.reload()">Обновить</button>
                </div>
            `;
        }
    }

    async function loadPermissions(userId) {
        const { data, error } = await supabase
            .from('admin_permissions')
            .select('*')
            .eq('user_id', userId)
            .maybeSingle();

        if (error && error.code !== 'PGRST116') console.error('Perms error:', error);

        if (data) {
            state.permissions = data;
        } else {
            const defaults = {
                can_manage_applications: false,
                can_manage_shooters: false,
                can_manage_bs: false,
                can_manage_tasks: false,
                can_manage_rules: false,
                can_manage_news: false,
                can_manage_admins: false,
            };
            if (isOwner()) Object.keys(defaults).forEach(k => defaults[k] = true);
            state.permissions = { ...defaults, user_id: userId };
        }
        console.log('✅ Permissions loaded:', state.permissions);
    }

    function renderAdmin() {
        const container = $('#adminContent');
        if (!container) return;
        if (!isAdmin()) {
            container.innerHTML = '<div class="empty"><div class="icon">🔒</div><h3>Нет доступа</h3></div>';
            return;
        }

        const sections = [];
        if (hasPerm('can_manage_applications') || isOwner()) sections.push({ id: 'apps', label: '📩 Заявки' });
        if (isOwner()) sections.push({ id: 'players', label: '👥 Игроки' });
        if (isOwner()) sections.push({ id: 'admins', label: '👑 Админы' });
        if (hasPerm('can_manage_tasks') || isOwner()) sections.push({ id: 'tasks_mgmt', label: '📋 Задачи' });
        if (hasPerm('can_manage_shooters') || isOwner()) sections.push({ id: 'shooters_mgmt', label: '🎯 Стрелки' });
        if (hasPerm('can_manage_bs') || isOwner()) sections.push({ id: 'bs_mgmt', label: '🛡 БС' });
        if (hasPerm('can_manage_rules') || isOwner()) sections.push({ id: 'rules_mgmt', label: '📜 Устав' });
        if (hasPerm('can_manage_news') || isOwner()) sections.push({ id: 'news_mgmt', label: '📰 Новости' });

        let html = `<div class="tabs">`;
        sections.forEach((s, i) => {
            html += `<button class="tab ${i===0?'active':''}" data-tab="${s.id}">${s.label}</button>`;
        });
        html += `</div><div id="adminTabContent">`;
        sections.forEach((s, i) => {
            html += `<div class="tab-content ${i===0?'active':''}" data-tab="${s.id}"><div id="adminPanel_${s.id}">Загрузка...</div></div>`;
        });
        html += `</div>`;
        container.innerHTML = html;

        container.querySelectorAll('.tab').forEach(btn => {
            btn.addEventListener('click', () => {
                container.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const id = btn.dataset.tab;
                container.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                const target = container.querySelector(`.tab-content[data-tab="${id}"]`);
                if (target) target.classList.add('active');
                loadAdminPanel(id);
            });
        });

        const firstTab = container.querySelector('.tab');
        if (firstTab) loadAdminPanel(firstTab.dataset.tab);
    }

    async function loadAdminPanel(tabId) {
        const panel = document.getElementById('adminPanel_' + tabId);
        if (!panel) return;
        switch (tabId) {
            case 'apps': await renderAdminApplications(panel); break;
            case 'players': await renderAdminPlayers(panel); break;
            case 'admins': await renderAdminAdmins(panel); break;
            case 'tasks_mgmt': await renderAdminTasks(panel); break;
            case 'shooters_mgmt': await renderAdminShooters(panel); break;
            case 'bs_mgmt': await renderAdminBS(panel); break;
            case 'rules_mgmt': await renderAdminRules(panel); break;
            case 'news_mgmt': await renderAdminNews(panel); break;
            default: panel.innerHTML = '<div class="empty">Раздел в разработке</div>';
        }
    }

    // ---------- Игроки (только владелец) ----------
    async function renderAdminPlayers(panel) {
        if (!isOwner()) { panel.innerHTML = '<div class="empty">Только для владельца</div>'; return; }
        panel.innerHTML = '<div class="loading-center"><div class="spinner"></div></div>';
        const { data, error } = await supabase
            .from('users')
            .select('*')
            .order('created_at', { ascending: false });
        if (error) { panel.innerHTML = `<p style="color:red;">Ошибка: ${error.message}</p>`; return; }

        let html = `<button class="btn btn-primary" onclick="showCreatePlayerModal()">➕ Создать игрока</button><div class="list" style="margin-top:12px;">`;
        if (!data || data.length === 0) html += `<div class="empty">Нет игроков</div>`;
        else {
            data.forEach(u => {
                const statusTag = u.status === 'approved' ? 'tag-approved' : u.status === 'pending' ? 'tag-pending' : 'tag-rejected';
                const roleTag = u.role === 'owner' ? 'tag-owner' : u.role === 'admin' ? 'tag-admin' : 'tag-player';
                html += `
                    <div class="list-item" data-id="${u.id}">
                        <div class="info">
                            <div class="title">${u.nickname} <span class="tag ${roleTag}">${u.role}</span> ${u.is_blocked ? '🚫' : ''}</div>
                            <div class="desc">ID: ${u.telegram_id}</div>
                            <div class="meta">Статус: <span class="tag ${statusTag}">${u.status}</span></div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-warning btn-sm toggle-block" data-id="${u.id}" data-blocked="${u.is_blocked}">${u.is_blocked ? '🔓' : '🔒'}</button>
                            ${u.role !== 'owner' ? `<button class="btn btn-danger btn-sm delete-user" data-id="${u.id}">🗑</button>` : ''}
                        </div>
                    </div>
                `;
            });
        }
        html += `</div>`;
        panel.innerHTML = html;

        panel.querySelectorAll('.toggle-block').forEach(btn => {
            btn.addEventListener('click', async () => {
                const id = btn.dataset.id;
                const blocked = btn.dataset.blocked === 'true';
                await supabase.from('users').update({ is_blocked: !blocked }).eq('id', id);
                showToast(blocked ? '🔓 Разблокирован' : '🔒 Заблокирован', 'success');
                await renderAdminPlayers(panel);
            });
        });
        panel.querySelectorAll('.delete-user').forEach(btn => {
            btn.addEventListener('click', async () => {
                if (!confirm('Удалить игрока навсегда?')) return;
                await supabase.from('users').delete().eq('id', btn.dataset.id);
                showToast('Удалено', 'success');
                await renderAdminPlayers(panel);
            });
        });
    }

    window.showEditTaskModal = async function(taskId) {
        let task = null;
        if (taskId) {
            const { data } = await supabase.from('tasks').select('*').eq('id', taskId).maybeSingle();
            if (data) task = data;
        }
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
            <div class="modal-box">
                <h3>${task ? '✏️ Редактировать задачу' : '➕ Новая задача'}</h3>
                <div class="form-group"><label>Название *</label><input type="text" id="taskTitle" value="${task ? task.title : ''}" /></div>
                <div class="form-group"><label>Описание</label><textarea id="taskDesc" rows="3">${task ? task.description || '' : ''}</textarea></div>
                <div class="form-group">
                    <label>Прогресс: <span id="progressLabel">${task ? task.progress : 0}%</span></label>
                    <input type="range" id="taskProgress" min="0" max="100" value="${task ? task.progress : 0}" />
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" id="modalCancel">Отмена</button>
                    <button class="btn btn-primary" id="modalSave">${task ? 'Сохранить' : 'Создать'}</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        const range = overlay.querySelector('#taskProgress');
        const label = overlay.querySelector('#progressLabel');
        range.addEventListener('input', () => { label.textContent = range.value + '%'; });
        overlay.querySelector('#modalCancel').onclick = () => overlay.remove();
        overlay.querySelector('#modalSave').onclick = async () => {
            const title = overlay.querySelector('#taskTitle').value.trim();
            const desc = overlay.querySelector('#taskDesc').value.trim();
            const progress = parseInt(range.value) || 0;
            if (!title) { showToast('Введите название', 'error'); return; }
            const payload = { title, description: desc, progress };
            if (task) {
                await supabase.from('tasks').update(payload).eq('id', task.id);
            } else {
                payload.created_by = state.user.id;
                await supabase.from('tasks').insert(payload);
            }
            showToast('✅ Сохранено', 'success');
            overlay.remove();
            const panel = document.getElementById('adminPanel_tasks_mgmt');
            if (panel) await renderAdminTasks(panel);

            const observer = new MutationObserver(() => {
                if (tg.BackButton) {
                    const show = state.currentPage !== 'dashboard' && state.currentPage !== 'auth';
                    if (show) tg.BackButton.show(); else tg.BackButton.hide();
                }
            });
            observer.observe(document.querySelector('.page.active') || document.body, {
                attributes: true,
                attributeFilter: ['class'],
                subtree: true
            });
        }

        await renderAuth();
        console.log('🚀 Bounty Team запущен. Проверьте консоль на ошибки.');
    })();
</script>
