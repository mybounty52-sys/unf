<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arizona Online — Маркетплейс</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --warning-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 70px;
        }

        header {
            background-color: var(--card-bg);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
        }

        .section {
            display: none;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .section.active {
            display: block;
        }

        h2 {
            margin-bottom: 15px;
            font-size: 1.3rem;
            color: #fff;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 5px;
        }

        /* Кнопки */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 10px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-danger { background-color: var(--danger-color); }
        .btn-danger:hover { background-color: #dc2626; }

        .btn-success { background-color: var(--success-color); }
        .btn-success:hover { background-color: #16a34a; }

        .btn-warning { background-color: var(--warning-color); }
        .btn-warning:hover { background-color: #d97706; }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn-group .btn {
            flex: 1;
        }

        /* Формы и поля */
        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        /* Карточка задачи */
        .task-card {
            background: #0f172a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }

        .progress-bar-bg {
            background: #334155;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-bar-fill {
            background: var(--accent-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Навигационная панель */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #334155;
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-item icon {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Arizona Online</h1>
    </header>

    <div class="container">
        <!-- Главный раздел -->
        <section class="section active" id="section-home">
            <h2>🛒 Маркетплейс</h2>
            <p style="color: var(--text-muted);">Добро пожаловать в магазин Arizona Online!</p>
        </section>

        <!-- Раздел Задачи (Проценты) -->
        <section class="section" id="section-tasks">
            <h2>🎯 Управление задачами</h2>
            <div class="task-card">
                <h3>Прогресс выполнения</h3>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="taskProgress"></div>
                </div>
                <p>Текущий процент: <strong id="progressPercentText">0%</strong></p>
                
                <hr style="border-color: #334155; margin: 15px 0;">

                <div class="input-group">
                    <label>Изменить на значение (%)</label>
                    <input type="number" id="percentStepInput" value="10" min="1" max="100">
                </div>

                <div class="btn-group">
                    <button class="btn btn-success" id="btnIncreasePercent">➕ Повысить</button>
                    <button class="btn btn-warning" id="btnDecreasePercent">➖ Убрать</button>
                </div>
                <button class="btn btn-danger" id="btnResetPercent">🔄 Сбросить до 0%</button>
            </div>
        </section>

        <!-- Очищенный раздел Админ-панели (Только кнопки Владельца) -->
        <section class="section" id="section-admin">
            <h2>🛡️ Админ-панель</h2>
            <div id="adminPanelContent">
                <div class="input-group">
                    <label for="adminTargetUser">Имя пользователя (Username) или ID:</label>
                    <input type="text" id="adminTargetUser" placeholder="Введите username (например: alex)">
                </div>

                <button class="btn" id="adminAllFunctionsBtn">⚙️ Все функции</button>
                <button class="btn btn-danger" id="adminBanBtn">🔨 Забанить</button>
                <button class="btn btn-success" id="adminUnbanBtn">🔓 Разбанить</button>
                <button class="btn btn-warning" id="adminMakeAdminBtn">👑 Сделать админом</button>
                <button class="btn btn-danger" id="adminRemoveAdminBtn">⬇️ Снять админа</button>
            </div>
        </section>
    </div>

    <!-- Нижний Nav-Bar -->
    <nav class="nav-bar">
        <button class="nav-item active" data-target="section-home">
            <span>🏠</span>
            <span>Главная</span>
        </button>
        <button class="nav-item" data-target="section-tasks">
            <span>🎯</span>
            <span>Задачи</span>
        </button>
        <!-- Кнопка Админ (видима для bounqy) -->
        <button class="nav-item" id="navAdminBtn" data-target="section-admin" style="display: none;">
            <span>🛡️</span>
            <span>Админ</span>
        </button>
    </nav>

    <script>
        // Текущий пользователь системы
        const currentUser = {
            username: 'bounqy', // Для проверки прав Владельца
            isBanned: false
        };

        // Состояние задач
        let currentProgress = 35; // Стартовый процент

        // Инициализация при загрузке DOM
        document.addEventListener('DOMContentLoaded', () => {
            initApp();
            setupEventListeners();
        });

        function initApp() {
            // Проверка прав на отображение кнопки Админ-панели
            if (currentUser.username === 'bounqy') {
                document.getElementById('navAdminBtn').style.display = 'flex';
            }

            // Обновляем прогресс-бар
            updateProgressBar();
        }

        // Переключение секций SPA
        function switchSection(targetId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));

            const targetSection = document.getElementById(targetId);
            if (targetSection) {
                targetSection.classList.add('active');
            }

            const activeNavBtn = document.querySelector(`.nav-item[data-target="${targetId}"]`);
            if (activeNavBtn) {
                activeNavBtn.classList.add('active');
            }
        }

        // Логика управления процентами
        function updateProgressBar() {
            if (currentProgress > 100) currentProgress = 100;
            if (currentProgress < 0) currentProgress = 0;

            const fill = document.getElementById('taskProgress');
            const text = document.getElementById('progressPercentText');

            fill.style.width = `${currentProgress}%`;
            text.innerText = `${currentProgress}%`;
        }

        function setupEventListeners() {
            // 1. Клики по нижнему меню navigation bar
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    const target = item.getAttribute('data-target');
                    switchSection(target);
                });
            });

            // 2. Кнопки управления процентами задач
            document.getElementById('btnIncreasePercent').addEventListener('click', () => {
                const step = parseInt(document.getElementById('percentStepInput').value) || 0;
                currentProgress += step;
                updateProgressBar();
            });

            document.getElementById('btnDecreasePercent').addEventListener('click', () => {
                const step = parseInt(document.getElementById('percentStepInput').value) || 0;
                currentProgress -= step;
                updateProgressBar();
            });

            document.getElementById('btnResetPercent').addEventListener('click', () => {
                currentProgress = 0;
                updateProgressBar();
            });

            // 3. Кнопки панели владельца (bounqy)
            const getTargetUser = () => {
                const val = document.getElementById('adminTargetUser').value.trim();
                if (!val) {
                    alert('Пожалуйста, укажите имя пользователя или ID!');
                    return null;
                }
                return val;
            };

            document.getElementById('adminAllFunctionsBtn').addEventListener('click', () => {
                alert('⚙️ Открыто меню управления всеми функциями системы.');
            });

            document.getElementById('adminBanBtn').addEventListener('click', () => {
                const user = getTargetUser();
                if (user) alert(`🔨 Пользователь "${user}" успешно забанен!`);
            });

            document.getElementById('adminUnbanBtn').addEventListener('click', () => {
                const user = getTargetUser();
                if (user) alert(`🔓 Пользователь "${user}" успешно разбанен!`);
            });

            document.getElementById('adminMakeAdminBtn').addEventListener('click', () => {
                const user = getTargetUser();
                if (user) alert(`👑 Пользователю "${user}" успешно выданы права администратора!`);
            });

            document.getElementById('adminRemoveAdminBtn').addEventListener('click', () => {
                const user = getTargetUser();
                if (user) alert(`⬇️ С пользователя "${user}" сняты права администратора.`);
            });
        }
    </script>
</body>
</html>
